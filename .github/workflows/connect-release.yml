# LZX Connect — multi-platform release (Linux, macOS, Windows).
# Hosted on PUBLIC lzxindustries/videomancer-firmware (unlimited GitHub Actions minutes).
# Source: monorepo software/desktop/connect at Forgejo tag connect/*.
#
# Signing secrets mirror lzxindustries/videomancer (APPLE_* from Developer ID .p12).
# Private videomancer repo CI is retired — org Free plan private-minute quota blocks it.

name: LZX Connect Release

on:
  push:
    tags:
      - 'connect/*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Monorepo tag (e.g. connect/1.0.2-rc.5)'
        required: true
        type: string

concurrency:
  group: connect-release-${{ github.ref_name || github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  meta:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.parse.outputs.product }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse tag
        id: parse
        env:
          REF_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG}"
          if [[ -z "$TAG" ]]; then
            TAG="${REF_TAG}"
          fi
          if [[ "$TAG" != connect/* ]]; then
            echo "Expected connect/* tag; got '${TAG}' (ref=${REF_TAG} input=${INPUT_TAG})" >&2
            exit 1
          fi
          PRODUCT="${TAG%%/*}"
          VERSION="${TAG#*/}"
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  connect-build:
    name: Build (${{ matrix.label }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            runner: ubuntu-22.04
            target: linux
          - label: macos
            runner: macos-latest
            target: macos
          - label: windows
            runner: windows-latest
            target: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout monorepo (Connect + platform)
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN }}
          MONOREPO_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git -c "http.extraHeader=Authorization: Bearer ${FORGEJO_TOKEN}" clone \
            --depth 1 --filter=blob:none --sparse \
            https://git.lzxindustries.net/lzx/lzxindustries.git monorepo
          cd monorepo
          git -c "http.extraHeader=Authorization: Bearer ${FORGEJO_TOKEN}" fetch \
            --depth 1 origin "refs/tags/${MONOREPO_TAG}:refs/tags/${MONOREPO_TAG}"
          git checkout "tags/${MONOREPO_TAG}"
          git config --local http.extraHeader "Authorization: Bearer ${FORGEJO_TOKEN}"
          git sparse-checkout init --no-cone
          git sparse-checkout set software/desktop/connect platform config pyproject.toml software/web/storefront/app/data/generated
          test -f software/desktop/connect/package.json
          test -f pyproject.toml
          test -f config/domains/connect-dfu-products.yaml

      - name: Install system dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: monorepo/software/desktop/connect/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Rust (Connect)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            monorepo/software/desktop/connect/src-tauri/target
          key: ${{ runner.os }}-connect-release-${{ hashFiles('monorepo/software/desktop/connect/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-connect-release-

      - name: Install monorepo + codegen
        working-directory: monorepo
        run: |
          pip install -e ".[ops]"
          python platform/workflows/connect_products_codegen.py
          python platform/workflows/fetch_dfu_util_binaries.py

      - name: Sync version from tag
        working-directory: monorepo/software/desktop/connect
        shell: bash
        run: bash scripts/sync_version.sh

      - name: Install frontend dependencies
        working-directory: monorepo/software/desktop/connect
        run: npm ci

      - name: TypeScript check
        working-directory: monorepo/software/desktop/connect
        run: npx tsc --noEmit

      - name: Clean stale bundle outputs
        shell: bash
        run: |
          rm -rf monorepo/software/desktop/connect/src-tauri/target/release/bundle
          rm -rf monorepo/software/desktop/connect/src-tauri/target/universal-apple-darwin/release/bundle
          rm -rf monorepo/software/desktop/connect/src-tauri/target/aarch64-apple-darwin/release/bundle
          rm -rf monorepo/software/desktop/connect/src-tauri/target/x86_64-apple-darwin/release/bundle

      - name: Setup macOS signing keychain
        if: matrix.target == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_NAME: build.keychain
          KEYCHAIN_PASSWORD: actions
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security import "${RUNNER_TEMP}/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_NAME"
          security list-keychain -d user -s "$KEYCHAIN_NAME" $(security list-keychain -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

      - name: Pre-build universal lzx-connect-cli (macOS)
        if: matrix.target == 'macos'
        working-directory: monorepo/software/desktop/connect/src-tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin --bin lzx-connect-cli --features headless
          cargo build --release --target x86_64-apple-darwin --bin lzx-connect-cli --features headless
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/lzx-connect-cli \
            target/aarch64-apple-darwin/release/lzx-connect-cli \
            target/x86_64-apple-darwin/release/lzx-connect-cli
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            target/universal-apple-darwin/release/lzx-connect-cli
          for b in resources/dfu-util/dfu-util resources/dfu-util/libusb-1.0.0.dylib resources/dfu-util/libusb-1.0.dylib; do
            [ -f "$b" ] && codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$b"
          done

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: monorepo/software/desktop/connect
          args: ${{ matrix.target == 'macos' && '--target universal-apple-darwin' || '' }}
          tagName: ''
          releaseName: ''

      - name: Upload Linux artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: connect-release-linux
          path: |
            monorepo/software/desktop/connect/src-tauri/target/release/bundle/deb/*.deb
            monorepo/software/desktop/connect/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: connect-release-macos
          path: |
            monorepo/software/desktop/connect/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: connect-release-windows
          path: |
            monorepo/software/desktop/connect/src-tauri/target/release/bundle/msi/*.msi
            monorepo/software/desktop/connect/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  connect-publish:
    name: Publish to videomancer-firmware
    needs: [meta, connect-build]
    if: needs.connect-build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: connect-release-*
          merge-multiple: true

      - name: Flatten artifacts + checksums
        working-directory: release-artifacts
        run: |
          find . -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -exec mv -n {} . \;
          find . -type d -empty -delete
          sha256sum *.deb *.AppImage *.dmg *.msi *.exe 2>/dev/null > checksums.sha256 || true
          ls -lh

      - name: Checkout monorepo (publish tooling)
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN }}
          MONOREPO_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          git -c "http.extraHeader=Authorization: Bearer ${FORGEJO_TOKEN}" clone \
            --depth 1 --filter=blob:none --sparse \
            https://git.lzxindustries.net/lzx/lzxindustries.git monorepo
          cd monorepo
          git -c "http.extraHeader=Authorization: Bearer ${FORGEJO_TOKEN}" fetch \
            --depth 1 origin "refs/tags/${MONOREPO_TAG}:refs/tags/${MONOREPO_TAG}"
          git checkout "tags/${MONOREPO_TAG}"
          git config --local http.extraHeader "Authorization: Bearer ${FORGEJO_TOKEN}"
          git sparse-checkout init --no-cone
          git sparse-checkout set platform config data pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publish tooling
        working-directory: monorepo
        run: pip install -e ".[ops]"

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## LZX Connect ${{ needs.meta.outputs.version }}

          Bugfix release: Windows program library install reliability and USB storage mode recovery.

          ### Fixed in 1.3.7
          - **Program library install (Windows)** — Pre-create all zip directory paths (official and community authors) before uploading files, so fresh SD cards no longer require manual folder creation via USB storage mode
          - **Serial I/O retry** — Recover from transient Windows CDC errors (os error 22) during intensive fs stat/mkdir round-trips, not only during file uploads
          - **USB storage mode exit** — Poll until the SD card is remounted before allowing program installs; refresh device and library state in the UI after exiting MSD
          - **Error messages** — Distinguish serial I/O failures, SD not mounted, and layout conflicts instead of misleading write-protection hints

          ### Requires Videomancer firmware
          Program library uploads need **Videomancer 1.0.0-rc.40** or later (watchdog feeding during SD writes). Retry after a USB disconnect if the device reboots mid-transfer.

          ### Supported devices
          - Videomancer (UF2)
          - Scrolls, Diver, Escher Sketch (STM32 DFU)
          - TBC2 Mk2, Memory Palace (USB mass storage)

          ### Artifacts
          - Windows: MSI + NSIS setup
          - macOS: universal DMG (Apple Silicon + Intel)
          - Linux: .deb + AppImage
          EOF

      - name: Publish release (Forgejo)
        working-directory: monorepo
        env:
          FORGEJO_RELEASE_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN }}
          FORGEJO_ADMIN_TOKEN: ${{ secrets.FORGEJO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          PRERELEASE="${{ needs.meta.outputs.prerelease }}"
          NOTES="$(cat ../release-notes.md)"
          ARGS=(firmware-publish --product connect --version "$VERSION" --create-release --notes "$NOTES")
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          for f in ../release-artifacts/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.deb|*.AppImage|*.dmg|*.msi|*.exe|*.sha256) ARGS+=(--artifact "$f") ;;
            esac
          done
          python platform/registry/lzx.py "${ARGS[@]}"

      - name: Publish GitHub shadow (gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          REPO="lzxindustries/videomancer-firmware"
          PRERE="${{ needs.meta.outputs.prerelease }}"
          mapfile -t FILES < <(find release-artifacts -maxdepth 1 -type f \( \
            -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o \
            -name '*.msi' -o -name '*.exe' -o -name 'checksums.sha256' \))
          test "${#FILES[@]}" -ge 1
          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          GH_ARGS=(release create "$TAG" "${FILES[@]}" --repo "$REPO" --title "$TAG" --notes-file release-notes.md)
          if [ "$PRERE" = "true" ]; then GH_ARGS+=(--prerelease); fi
          gh "${GH_ARGS[@]}"
          echo "GitHub shadow: https://github.com/${REPO}/releases/tag/${TAG}"
